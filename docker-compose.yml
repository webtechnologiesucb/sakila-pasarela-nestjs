services:
  db:
    image: postgres:17-alpine
    container_name: sakila-pay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sakila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sakila}
      POSTGRES_DB: ${POSTGRES_DB:-sakila_gateway}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sakila_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sakila} -d ${POSTGRES_DB:-sakila_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakila-pay-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sakila}:${POSTGRES_PASSWORD:-sakila}@db:5432/${POSTGRES_DB:-sakila_gateway}?schema=public
      JWT_SECRET: ${JWT_SECRET:-demo-jwt-secret-change-me-123456}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-demo-refresh-secret-change-me-654321}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sakila-pay-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sakila_pgdata:
