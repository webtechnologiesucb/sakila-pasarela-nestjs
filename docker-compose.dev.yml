# Development stack with hot reload.
# Usage: docker compose -f docker-compose.dev.yml up --build
services:
  db:
    image: postgres:17-alpine
    container_name: sakila-pay-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sakila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sakila}
      POSTGRES_DB: ${POSTGRES_DB:-sakila_gateway}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sakila_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sakila} -d ${POSTGRES_DB:-sakila_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: node:20-alpine
    container_name: sakila-pay-backend-dev
    working_dir: /app
    command: >
      sh -c "apk add --no-cache openssl &&
             npm install --no-audit --no-fund &&
             npx prisma generate &&
             npx prisma migrate deploy &&
             npx ts-node prisma/seed.ts &&
             npm run start:dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sakila}:${POSTGRES_PASSWORD:-sakila}@db:5432/${POSTGRES_DB:-sakila_gateway}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-123456}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-654321}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - sakila_backend_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: sakila-pay-frontend-dev
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - sakila_frontend_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  sakila_pgdata_dev:
  sakila_backend_modules:
  sakila_frontend_modules:
